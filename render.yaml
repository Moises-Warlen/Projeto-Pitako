services:
  - type: web
    name: pitako-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DatabaseProvider
        value: PostgreSql
      - key: DATABASE_URL
        sync: false
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_PASSPHRASE
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BOOTSTRAP_MASTER_EMAIL
        value: master@pitako.com.br
      - key: BOOTSTRAP_MASTER_PASSWORD
        sync: false
